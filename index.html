<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ski Weather">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Ski Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column; picker on top, then Stüve, cloud, wind, snow, freezing level, SNOTEL. */
:root{
  --page:#f4f6f7; --surface:#fcfcfb; --ink:#0d1418; --ink2:#4b555b; --muted:#7f888d;
  --grid:#e0e4e6; --axis:#bcc4c8; --ec:#2a78d6; --rr:#eb6834; --ref:#5d6a71; --now:#6250d6; --last:#1baf7a; --bad:#d03b3b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0c1114; --surface:#161c20; --ink:#eef1f2; --ink2:#bcc5c9; --muted:#8a9498;
    --grid:#263036; --axis:#3a464d; --ec:#3987e5; --rr:#d95926; --ref:#9aa6ac; --now:#9085e9; --last:#199e70; --bad:#e66767; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0c1114; --surface:#161c20; --ink:#eef1f2; --ink2:#bcc5c9; --muted:#8a9498;
  --grid:#263036; --axis:#3a464d; --ec:#3987e5; --rr:#d95926; --ref:#9aa6ac; --now:#9085e9; --last:#199e70; --bad:#e66767; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 2px;letter-spacing:.02em}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--ink2);margin:6px 0 0;max-width:68ch}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:18px}
.picker .row{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;align-items:end}
.picker label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
select,input[type=date]{font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
.status{margin:10px 0 0;font-size:13.5px;color:var(--ink2);min-height:20px}
.status.err{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin:6px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:3px solid}
.sw.ec{border-color:var(--ec)} .sw.rr{border-color:var(--rr)} .sw.d{border-top-style:dashed;border-color:var(--ink2);border-top-width:2px} .sw.s{border-color:var(--ink2);border-top-width:2px}
.sw.n{border-color:var(--now)} .sw.l{border-color:var(--last);border-top-width:2px} .sw.md{border-color:var(--muted);border-top-style:dashed;border-top-width:2px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:500;color:var(--ink2);font-size:13px}
td.big{font-size:19px;font-weight:600}
td small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.scroll{overflow-x:auto}
svg{display:block;width:100%;height:auto;font-family:var(--body);touch-action:pan-y}
svg text{fill:var(--muted);font-size:11px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:10px 0 6px}
.controls input[type=range]{flex:1;min-width:150px;height:32px;accent-color:var(--ec)}
.time{font-family:var(--display);font-size:28px;font-weight:600;min-width:100px}
button{font:inherit;font-weight:500;color:var(--ink);background:var(--page);border:1px solid var(--axis);border-radius:8px;padding:6px 16px;min-height:42px;cursor:pointer}
button:hover{border-color:var(--ink2)}
button.primary{background:var(--ec);border-color:var(--ec);color:#fff}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ec);outline-offset:2px}
.readout{font-size:13.5px;color:var(--ink2);min-height:64px;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink);font-weight:600}
details{margin-top:10px;font-size:13px} summary{cursor:pointer;color:var(--ink2)}
details table td,details table th{padding:4px 8px;font-size:12.5px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:6px;padding:6px 9px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:2}
.rel{position:relative}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.arrow{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.arrow path{fill:none;stroke:var(--ink2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat{font-size:13px;color:var(--ink2);margin:0 0 4px;font-variant-numeric:tabular-nums;max-width:70ch}
.stat b{color:var(--ink);font-weight:600}
.narrowbox{max-width:600px}
footer{color:var(--muted);font-size:12.5px;max-width:75ch;overflow-wrap:anywhere}
footer a{color:inherit}
@media (max-width:560px){
  body{font-size:14.5px}
  h1{font-size:29px} h2{font-size:22px}
  .card{padding:14px 12px}
  .picker .row{grid-template-columns:1fr 1fr}
  .picker .row .go{grid-column:1 / -1}
  .picker .row .go button{width:100%}
  th,td{padding:8px 5px}
  td.big{font-size:16px}
  .time{font-size:26px;min-width:88px}
  .controls{gap:10px}
  .controls input[type=range]{min-width:110px}
  svg text{font-size:11.5px}
  .panels{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<section class="card picker" aria-label="Choose ski area and date">
  <div class="row">
    <div><label for="resort">Ski area</label><select id="resort"></select></div>
    <div><label for="date">Date</label><input type="date" id="date"></div>
    <div class="go"><button id="go" class="primary" type="button">Get forecast</button></div>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</section>
<div id="out" style="display:flex;flex-direction:column;gap:18px"></div>
<footer id="foot"></footer>
</main>

<script>
/* ===================== Config ===================== */
const TZ='America/Denver';
const OM='https://api.open-meteo.com';
const AWDB='https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1';
// Elevations in feet; coordinates approximate (temperatures are adjusted to the given elevation).
const RESORTS=[
  {id:'copper',name:'Copper Mountain',base:{ft:9712,lat:39.502,lon:-106.151},top:{ft:12441,lat:39.475,lon:-106.156},snotel:'415:CO:SNTL'},
  {id:'winterpark',name:'Winter Park',base:{ft:9000,lat:39.887,lon:-105.763},top:{ft:12060,lat:39.858,lon:-105.800},snotel:'335:CO:SNTL'},
  {id:'abasin',name:'Arapahoe Basin',base:{ft:10780,lat:39.642,lon:-105.872},top:{ft:13050,lat:39.634,lon:-105.862},snotel:'505:CO:SNTL'},
  {id:'eldora',name:'Eldora',base:{ft:9200,lat:39.938,lon:-105.584},top:{ft:10600,lat:39.928,lon:-105.596},snotel:'564:CO:SNTL'}
];
const L21=[700,675,650,625,600,575,550,525,500,475,450,425,400,375,350,325,300,275,250,225,200];
const L7=[700,600,500,400,300,250,200];
const MODELNAME={ec:'ECMWF',rr:'RRFS'};

/* ===================== Helpers ===================== */
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const $=id=>document.getElementById(id);
const f1=v=>v==null?'–':(Math.round(v*10)/10).toFixed(1);
const ftOf=m=>Math.round(m*3.28084/10)*10;
const mOf=ft=>Math.round(ft*0.3048);
const hrLabel=h=>h===0?'12 AM':h<12?h+' AM':h===12?'12 PM':(h-12)+' PM';
const sgn=v=>v>0?'+':v<0?'−':'';
const todayStr=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);};
const dayDiff=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((p(b)-p(a))/864e5);};
const fmtDay=(s,o={weekday:'short',month:'short',day:'numeric'})=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-US',{...o,timeZone:'UTC'});};
const full=a=>Array.isArray(a)&&a.length===24&&a.every(v=>v!=null);
const dew=(t,rh)=>{const g=Math.log(Math.max(rh,1)/100)+17.625*t/(243.04+t);return 243.04*g/(17.625-g);};
const isNarrow=()=>window.matchMedia('(max-width:560px)').matches;
const qs=o=>Object.entries(o).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
async function getJSON(u){
  let r;
  try{r=await fetch(u);}catch(e){throw new Error(`Could not reach ${new URL(u).host}. Check your connection and try again.`);}
  if(!r.ok)throw new Error(`${new URL(u).host} answered ${r.status}. Try again in a minute.`);
  const j=await r.json();
  if(j&&j.error)throw new Error(j.reason||'The data service refused the request.');
  return j;
}
const store={get(){try{return JSON.parse(localStorage.getItem('skiweather')||'{}');}catch(e){return {};}},set(v){try{localStorage.setItem('skiweather',JSON.stringify(v));}catch(e){}}};

/* ===================== Data ===================== */
function locParams(R){return {latitude:`${R.base.lat},${R.top.lat}`,longitude:`${R.base.lon},${R.top.lon}`,elevation:`${mOf(R.base.ft)},${mOf(R.top.ft)}`};}
async function surface(model,R,date){
  const j=await getJSON(`${OM}/v1/forecast?`+qs({...locParams(R),hourly:'temperature_2m,dew_point_2m,cloud_cover,surface_pressure,wind_gusts_10m,wind_speed_10m,wind_direction_10m',wind_speed_unit:'mph',models:model,timezone:TZ,start_date:date,end_date:date}));
  const [b,t]=j;
  return {base:b.hourly,top:t.hourly,cells:[b.latitude,b.longitude,t.latitude,t.longitude]};
}
async function sounding(model,levels,R,date){
  const v=levels.flatMap(l=>[`temperature_${l}hPa`,`relative_humidity_${l}hPa`,`geopotential_height_${l}hPa`]).join(',');
  const j=await getJSON(`${OM}/v1/forecast?`+qs({latitude:R.base.lat,longitude:R.base.lon,hourly:v,models:model,timezone:TZ,start_date:date,end_date:date}));
  const h=j.hourly;
  return {L:levels,T:levels.map(l=>h[`temperature_${l}hPa`]),RH:levels.map(l=>h[`relative_humidity_${l}hPa`]),Z:levels.map(l=>h[`geopotential_height_${l}hPa`]),cell:[j.latitude,j.longitude]};
}
async function fourDays(model,R,date,withFz){
  const j=await getJSON(`${OM}/v1/forecast?`+qs({...locParams(R),hourly:withFz?'snowfall,freezing_level_height':'snowfall,temperature_2m',models:model,timezone:TZ,start_date:addDays(date,-3),end_date:date}));
  const daily=(a,f)=>[0,1,2,3].map(d=>{const s=(a||[]).slice(d*24,d*24+24);return s.length===24&&s.every(v=>v!=null)?f(s):null;});
  const sum=s=>s.reduce((x,y)=>x+y,0);
  const out={snow:{base:daily(j[0].hourly.snowfall,sum),top:daily(j[1].hourly.snowfall,sum)}};
  if(withFz){out.fz=daily(j[0].hourly.freezing_level_height,s=>{const m=Math.max(...s);return [m,s.indexOf(m)];});}
  else out.baseT=j[0].hourly.temperature_2m;
  return out;
}
async function ecFreezing(R,date,baseT){
  const j=await getJSON(`${OM}/v1/forecast?`+qs({latitude:R.base.lat,longitude:R.base.lon,hourly:'temperature_700hPa,temperature_600hPa,geopotential_height_700hPa,geopotential_height_600hPa',models:'ecmwf_ifs025',timezone:TZ,start_date:addDays(date,-3),end_date:date}));
  const h=j.hourly;
  return [0,1,2,3].map(d=>{let best=null;
    for(let k=0;k<24;k++){const i=d*24+k,t7=h.temperature_700hPa[i],t6=h.temperature_600hPa[i],z7=h.geopotential_height_700hPa[i],z6=h.geopotential_height_600hPa[i];
      if([t7,t6,z7,z6].some(v=>v==null))continue;
      let z=null;
      if(t7>0&&t6<0)z=z7+(z6-z7)*t7/(t7-t6);
      else if(t7<=0){const tb=baseT&&baseT[i],zb=R.base.ft*0.3048;if(tb!=null&&tb>0&&z7>zb)z=zb+(z7-zb)*tb/(tb-t7);}
      if(z!=null&&(!best||z>best[0]))best=[z,k];}
    if(!best&&baseT){const tb=baseT.slice(d*24,d*24+24);if(tb.length===24&&tb.every(v=>v!=null&&v<=0))return {below:true};}
    return best;});
}
async function runInfo(model){
  try{const j=await getJSON(`${OM}/data/${model}/static/meta.json`);const d=new Date(j.last_run_initialisation_time*1000);
    return `${String(d.getUTCHours()).padStart(2,'0')}Z ${d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}`;}catch(e){return null;}
}
async function snotel(trip){
  const today=todayStr(),[y,mo]=today.split('-').map(Number);
  const sy=mo>=10?y:y-1,seasonStart=`${sy}-10-01`,prevStart=`${sy-1}-10-01`;
  const [st,dat]=await Promise.all([
    getJSON(`${AWDB}/stations?stationTriplets=${trip}`),
    getJSON(`${AWDB}/data?`+qs({stationTriplets:trip,elements:'WTEQ,SNWD',duration:'DAILY',beginDate:prevStart,endDate:today,centralTendencyType:'MEDIAN'}))]);
  const els=(dat[0]&&dat[0].data)||[];
  const by=code=>{const e=els.find(x=>x.stationElement.elementCode===code);const m={};(e?e.values:[]).forEach(v=>{m[String(v.date).slice(0,10)]=v;});return m;};
  const W=by('WTEQ'),S=by('SNWD');
  const days=dayDiff(seasonStart,today);
  const cur=[],med=[],depth=[];
  for(let i=0;i<=days;i++){const d=addDays(seasonStart,i);cur.push(W[d]?.value??null);med.push(W[d]?.median??null);depth.push(S[d]?.value??null);}
  let n=cur.length-1;while(n>=0&&cur[n]==null)n--;
  const prevWk=[],medWk=[];
  for(let w=0;w<40;w++){const d=addDays(prevStart,7*w);prevWk.push(W[d]?.value??null);medWk.push(W[d]?.median??null);}
  return {name:st[0]?.name||trip,elev:st[0]?.elevation,trip,seasonStart,cur:cur.slice(0,n+1),med:med.slice(0,n+1),depth:depth.slice(0,n+1),prevWk,medWk,last:n>=0?addDays(seasonStart,n):null};
}

async function load(R,date){
  // 1. Decide the mode: RRFS must cover all 24 hours of the day.
  let rr=null;
  try{rr=await surface('ncep_rrfs_conus',R,date);}catch(e){rr=null;}
  const rrOK=!!rr&&full(rr.base.temperature_2m)&&full(rr.top.temperature_2m);
  let ec=await surface('ecmwf_ifs',R,date),ecSurf='9 km';
  if(!(full(ec.base.temperature_2m)&&full(ec.top.temperature_2m))){
    const alt=await surface('ecmwf_ifs025',R,date);
    if(full(alt.base.temperature_2m)&&full(alt.top.temperature_2m)){ec=alt;ecSurf='0.25°';}
    else throw new Error(`ECMWF doesn't reach ${fmtDay(date)} yet. Pick a date closer to today (ECMWF runs out about 10 to 15 days).`);
  }
  const mode=rrOK?'compare':'ec';
  const keys=mode==='compare'?['ec','rr']:['ec'];
  const jobs={
    ecSnd:sounding('ecmwf_ifs025',L7,R,date),
    ec4fz:fourDays('ecmwf_ifs',R,date,false).then(async v=>({ec4:v,fz:await ecFreezing(R,date,v.baseT)})),
    ecRun:runInfo('ecmwf_ifs'),
    snotel:snotel(R.snotel).catch(e=>({error:e.message}))
  };
  if(mode==='compare'){jobs.rrSnd=sounding('ncep_rrfs_conus',L21,R,date);jobs.rr4=fourDays('ncep_rrfs_conus',R,date,true);jobs.rrRun=runInfo('ncep_rrfs_conus');}
  const names=Object.keys(jobs),vals=await Promise.all(Object.values(jobs)),J=Object.fromEntries(names.map((k,i)=>[k,vals[i]]));
  const surf={ec,rr:mode==='compare'?rr:null};
  const D={R,date,mode,keys,ecSurf,surf,snd:{ec:J.ecSnd,rr:J.rrSnd},runs:{ec:J.ecRun,rr:J.rrRun},
    days:[0,1,2,3].map(i=>addDays(date,i-3)),
    snow:{ec:J.ec4fz.ec4.snow,rr:J.rr4?.snow},
    fz:{ec:J.ec4fz.fz.map(v=>v&&(v.below?v:[ftOf(v[0]),v[1]])),rr:J.rr4?.fz?.map(v=>v&&[ftOf(v[0]),v[1]])},
    snotel:J.snotel,pulled:new Date()};
  // altitude labels for the 21 pressure levels
  if(mode==='compare'&&full(J.rrSnd.Z[0]))D.ZM=J.rrSnd.Z.map(a=>a[12]);
  else{const Z=J.ecSnd.Z.map(a=>a[12]);D.ZM=L21.map(p=>{for(let i=0;i<L7.length-1;i++){const a=L7[i],b=L7[i+1];if(p<=a&&p>=b){const w=Math.log(a/p)/Math.log(a/b);return Z[i]+(Z[i+1]-Z[i])*w;}}return null;});}
  return D;
}

/* ===================== Render ===================== */
let timers=[];
function render(D){
  timers.forEach(clearInterval);timers=[];
  const N=isNarrow(),R=D.R,keys=D.keys,two=keys.length>1;
  const leg=(suffix='')=>`<div class="legend">${keys.map(k=>`<span><i class="sw ${k}"></i>${MODELNAME[k]}${suffix}</span>`).join('')}</div>`;
  const runTxt=keys.map(k=>D.runs[k]?`${MODELNAME[k]} ${D.runs[k]} run`:`${MODELNAME[k]} latest run`).join(', ');
  const title=`${R.name}, ${fmtDay(D.date,{weekday:'long',month:'short',day:'numeric'})}: ${two?'ECMWF vs RRFS':'ECMWF forecast'}`;
  document.title=`${R.name} ${fmtDay(D.date)} – Ski Weather`;
  $('out').innerHTML=`
<header>
  <h1>${title}</h1>
  <p class="sub">Base ${R.base.ft.toLocaleString()} ft, summit ${R.top.ft.toLocaleString()} ft. Times are Mountain Time. ${two?'':'ECMWF only: RRFS does not reach this date (it runs about 3½ days ahead). '}Data: ${runTxt}, pulled ${D.pulled.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ})}. ECMWF uses its ${D.ecSurf} grid for surface values and 0.25° for the sounding.</p>
</header>
<section class="card"><h2>Stüve diagram</h2>
  <div class="controls"><span class="time" id="sl">10 AM</span><input type="range" id="sh" min="0" max="23" step="1" value="10" aria-label="Hour of day for the Stüve diagram"><button id="sp" type="button">Play</button></div>
  <div class="legend">${keys.map(k=>`<span><i class="sw ${k}"></i>${MODELNAME[k]}</span>`).join('')}<span><i class="sw s"></i>Temperature</span><span><i class="sw d"></i>Dew point</span><span style="color:var(--muted)">Thin straight lines: dry adiabats. Thin curves: moist adiabats.</span></div>
  <svg id="stuve" role="img" aria-label="Stüve diagram of temperature and dew point"></svg>
  <p class="readout" id="ro"></p>
</section>
<section class="card"><h2>Cloud cover by hour</h2>${leg()}
  <div class="rel"><svg id="cloud" role="img" aria-label="Hourly total cloud cover"></svg><div class="tip" id="ctip"></div></div>
  <details><summary>Hourly cloud table</summary><div class="scroll"><table id="ctable"></table></div></details>
</section>
<section class="card"><h2>Surface wind gusts</h2>
  <div class="controls"><span class="time" id="wl">10 AM</span><input type="range" id="wh" min="0" max="23" step="1" value="10" aria-label="Hour of day for wind"><button id="wp" type="button">Play</button></div>
  <div class="scroll"><table id="wtable"></table></div>
  <div style="margin-top:14px">${leg(' gust')}</div>
  <div class="panels">
    <div><h3>Base, ${R.base.ft.toLocaleString()} ft</h3><svg id="wbase" role="img" aria-label="Hourly wind gusts at the base"></svg></div>
    <div><h3>Summit, ${R.top.ft.toLocaleString()} ft</h3><svg id="wtop" role="img" aria-label="Hourly wind gusts at the summit"></svg></div>
  </div>
</section>
<section class="card"><h2>Snowfall, ${fmtDay(D.days[0],{month:'short',day:'numeric'})} to ${fmtDay(D.days[3],{month:'short',day:'numeric'})}</h2>
  <div class="scroll"><table id="snow"></table></div>
</section>
<section class="card"><h2>Highest freezing level each day</h2>${leg()}
  <div class="rel"><svg id="fz" role="img" aria-label="Daily highest freezing level"></svg><div class="tip" id="ftip"></div></div>
  ${D.keys.some(k=>D.fz[k].some(v=>v&&v.below))?'<p class="stat">Open circles on the base line: below freezing at the base all day.</p>':''}${D.keys.some(k=>D.fz[k].some(v=>!v))?'<p class="stat">Days with no point: the model data was incomplete.</p>':''}
</section>
<section class="card"><h2>SNOTEL season so far</h2><div id="snotelbox"></div></section>`;
  drawStuve(D,N);drawCloud(D,N);drawWind(D,N);drawSnow(D);drawFz(D,N);drawSnotel(D,N);
  const s=D.snotel;
  $('foot').innerHTML=`Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a> (models <code>ecmwf_ifs</code>${D.ecSurf==='9 km'?'':' (fallback <code>ecmwf_ifs025</code>)'} and <code>ecmwf_ifs025</code>, ECMWF open data${two?'; <code>ncep_rrfs_conus</code>, NOAA':''}). ECMWF surface cells near ${D.surf.ec.cells.map(v=>v.toFixed(3)).join(', ')}${two?`; RRFS cells near ${D.surf.rr.cells.map(v=>v.toFixed(3)).join(', ')}`:''}; temperatures are adjusted to the base and summit elevations. Dew point aloft is derived from temperature and relative humidity. The ECMWF sounding has only 7 pressure levels${two?' (21 for RRFS)':''}. ECMWF's freezing level is interpolated between its 700 and 600 hPa temperatures, or between the base temperature and 700 hPa when 700 hPa is below freezing. Days before the forecast day are model values, not observations. ${two?'':'Further out, ECMWF\'s native time step is longer than an hour, so hourly values are interpolated and smoother than they look. '}Models at 3 to 9 km cannot resolve individual lifts or aspects. SNOTEL data from the USDA NRCS National Water and Climate Center${s&&!s.error?` (station ${s.trip.split(':')[0]}, ${s.name})`:''}; recent readings are provisional, and last season and the median are sampled weekly.`;
}

/* ---- Stüve ---- */
function drawStuve(D,N){
  const svg=$('stuve'),W=N?400:780,H=N?540:600,m=N?{l:32,r:60,t:12,b:36}:{l:52,r:74,t:14,b:40};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const keys=D.keys,S=D.surf;
  const psMax=Math.max(...keys.flatMap(k=>S[k].base.surface_pressure));
  const K=0.286,PT=200,PB=Math.max(720,Math.ceil((psMax+8)/10)*10),TMIN=-65,TMAX=20;
  const x=t=>m.l+(W-m.l-m.r)*(t-TMIN)/(TMAX-TMIN);
  const y=p=>m.t+(H-m.t-m.b)*(Math.pow(p,K)-Math.pow(PT,K))/(Math.pow(PB,K)-Math.pow(PT,K));
  const yInv=py=>Math.pow(Math.pow(PT,K)+(py-m.t)/(H-m.t-m.b)*(Math.pow(PB,K)-Math.pow(PT,K)),1/K);
  const cid='clip'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:cid},el('defs',{},svg));el('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b},cp);
  const bg=el('g',{'clip-path':`url(#${cid})`},svg);
  for(let t=-60;t<=20;t+=10){el('line',{x1:x(t),x2:x(t),y1:m.t,y2:H-m.b,stroke:t===0?'var(--axis)':'var(--grid)'},bg);
    if(!N||t%20===0)el('text',{x:x(t),y:H-m.b+16,'text-anchor':'middle'},svg).textContent=t+'°C';}
  [700,650,600,550,500,450,400,350,300,250,200].filter(p=>p<PB).forEach(p=>{
    el('line',{x1:m.l,x2:W-m.r,y1:y(p),y2:y(p),stroke:'var(--grid)'},bg);
    el('text',{x:m.l-6,y:y(p)+4,'text-anchor':'end'},svg).textContent=p;
    const z=D.ZM[L21.indexOf(p)];if(z!=null)el('text',{x:W-m.r+6,y:y(p)+4},svg).textContent=(Math.round(z*3.28084/100)*100).toLocaleString()+' ft';});
  el('text',{x:m.l-6,y:H-m.b+(N?30:16),'text-anchor':N?'start':'end'},svg).textContent='hPa';
  for(let th=270;th<=420;th+=10){const T=p=>th*Math.pow(p/1000,K)-273.15;
    el('line',{x1:x(T(PB)),y1:y(PB),x2:x(T(PT)),y2:y(PT),stroke:'var(--axis)','stroke-width':.7,opacity:.8},bg);}
  const es=tc=>6.112*Math.exp(17.67*tc/(tc+243.5));
  for(let t0=-15;t0<=15;t0+=5){let T=t0+273.15,d='';
    for(let p=PB;p>=PT;p-=5){d+=(d?'L':'M')+x(T-273.15).toFixed(1)+' '+y(p).toFixed(1);
      const e=es(T-273.15),rs=0.622*e/(p-e),Lv=2.501e6,Rd=287.04,Cp=1005.7;
      T-=(1/p)*(Rd*T+Lv*rs)/(Cp+Lv*Lv*rs*0.622/(Rd*T*T))*5;}
    el('path',{d,fill:'none',stroke:'var(--axis)','stroke-width':.7,'stroke-dasharray':'2 3'},bg);}
  const refs={};
  [['base','Base'],['top','Summit']].forEach(([k,n])=>{refs[k]={ln:el('line',{x1:m.l,x2:W-m.r,stroke:'var(--ref)','stroke-dasharray':'6 4'},bg),tx:el('text',{x:m.l+6},svg)};refs[k].tx.textContent=n;refs[k].tx.style.fill='var(--ink2)';});
  el('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'none',stroke:'var(--axis)'},svg);
  const fg=el('g',{'clip-path':`url(#${cid})`},svg),paths={};
  keys.forEach(k=>{paths[k]={td:el('path',{fill:'none',stroke:`var(--${k})`,'stroke-width':2,'stroke-dasharray':'6 4','stroke-linejoin':'round'},fg),t:el('path',{fill:'none',stroke:`var(--${k})`,'stroke-width':2.4,'stroke-linejoin':'round'},fg)};});
  const guide=el('line',{x1:m.l,x2:W-m.r,stroke:'var(--ink2)',visibility:'hidden'},fg);
  const dots=keys.flatMap(k=>['t','td'].map(v=>({k,v,c:el('circle',{r:4,fill:`var(--${k})`,stroke:'var(--surface)','stroke-width':2,visibility:'hidden'},fg)})));
  const profile=(k,h)=>{const s=S[k].base,P=D.snd[k];
    const pts=[{p:s.surface_pressure[h],t:s.temperature_2m[h],td:s.dew_point_2m[h]}];
    P.L.forEach((p,i)=>{const t=P.T[i][h],rh=P.RH[i][h];if(p<pts[0].p&&t!=null&&rh!=null)pts.push({p,t,td:dew(t,rh)});});
    return pts;};
  const at=(pts,p)=>{if(!pts||p>pts[0].p)return null;
    for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(p<=a.p&&p>=b.p){const w=Math.log(a.p/p)/Math.log(a.p/b.p);return{t:a.t+(b.t-a.t)*w,td:a.td+(b.td-a.td)*w};}}return null;};
  let hour=10,cur={},hoverP=null;
  const topPs=S.ec.top.surface_pressure;
  function readout(){
    const p=hoverP??topPs[hour],label=hoverP?`${Math.round(p)} hPa`:`Summit level (${Math.round(p)} hPa, free air)`;
    const part=k=>{const v=at(cur[k],p);return v?`<span class="dot" style="background:var(--${k})"></span>${MODELNAME[k]} <b>${f1(v.t)} °C</b>, dew point ${f1(v.td)} °C`:`${MODELNAME[k]}: below model surface`;};
    $('ro').innerHTML=`<b>${label}</b><br>${keys.map(part).join(N?'<br>':' &nbsp; ')}`;
    if(hoverP){guide.setAttribute('y1',y(p));guide.setAttribute('y2',y(p));guide.setAttribute('visibility','visible');}else guide.setAttribute('visibility','hidden');
    dots.forEach(d=>{const v=hoverP&&at(cur[d.k],p);if(v){d.c.setAttribute('cx',x(v[d.v]));d.c.setAttribute('cy',y(p));d.c.setAttribute('visibility','visible');}else d.c.setAttribute('visibility','hidden');});
  }
  function draw(){
    $('sl').textContent=hrLabel(hour);
    keys.forEach(k=>{cur[k]=profile(k,hour);const line=v=>cur[k].map((q,i)=>(i?'L':'M')+x(q[v]).toFixed(1)+' '+y(q.p).toFixed(1)).join('');paths[k].t.setAttribute('d',line('t'));paths[k].td.setAttribute('d',line('td'));});
    const lv={base:S.ec.base.surface_pressure[hour],top:topPs[hour]};
    for(const k in refs){const yy=y(lv[k]);refs[k].ln.setAttribute('y1',yy);refs[k].ln.setAttribute('y2',yy);refs[k].tx.setAttribute('y',yy-5);}
    readout();
  }
  const slider=$('sh'),play=$('sp');let timer=null;
  slider.oninput=()=>{hour=+slider.value;draw();};
  play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='Play';return;}play.textContent='Pause';timer=setInterval(()=>{hour=(hour+1)%24;slider.value=hour;draw();},700);timers.push(timer);};
  const smove=e=>{const r=svg.getBoundingClientRect(),py=(e.clientY-r.top)*H/r.height;hoverP=(py<m.t||py>H-m.b)?null:yInv(py);readout();};
  svg.addEventListener('pointermove',smove);svg.addEventListener('pointerdown',smove);
  svg.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')return;hoverP=null;readout();});
  draw();
}

/* ---- Cloud ---- */
function drawCloud(D,N){
  const svg=$('cloud'),W=N?400:780,H=N?230:250,m={l:N?38:44,r:N?88:92,t:14,b:34},keys=D.keys;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const C=k=>D.surf[k].base.cloud_cover;
  const x=h=>m.l+(W-m.l-m.r)*h/23,y=v=>m.t+(H-m.t-m.b)*(1-v/100);
  [0,25,50,75,100].forEach(v=>{el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v?'var(--grid)':'var(--axis)'},svg);el('text',{x:m.l-8,y:y(v)+4,'text-anchor':'end'},svg).textContent=v+'%';});
  [...Array(24).keys()].filter(h=>h%(N?6:3)===0).forEach(h=>{el('text',{x:x(h),y:H-12,'text-anchor':'middle'},svg).textContent=hrLabel(h);});
  const ends=keys.map(k=>({k,v:C(k)[23]})).sort((a,b)=>b.v-a.v);
  keys.forEach(k=>{el('path',{d:C(k).map((v,h)=>(h?'L':'M')+x(h).toFixed(1)+' '+y(v).toFixed(1)).join(''),fill:'none',stroke:`var(--${k})`,'stroke-width':2,'stroke-linejoin':'round'},svg);
    el('circle',{cx:x(23),cy:y(C(k)[23]),r:4,fill:`var(--${k})`,stroke:'var(--surface)','stroke-width':2},svg);});
  let lastY=-99;ends.forEach(({k,v})=>{let ty=y(v)+4;if(ty-lastY<14)ty=lastY+14;lastY=ty;const t=el('text',{x:x(23)+9,y:ty},svg);t.textContent=MODELNAME[k]+' '+Math.round(v)+'%';t.style.fill='var(--ink2)';});
  const cross=el('line',{y1:m.t,y2:H-m.b,stroke:'var(--axis)',visibility:'hidden'},svg),tip=$('ctip');
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,h=Math.max(0,Math.min(23,Math.round((px-m.l)/(W-m.l-m.r)*23)));
    cross.setAttribute('x1',x(h));cross.setAttribute('x2',x(h));cross.setAttribute('visibility','visible');
    tip.innerHTML=`<b>${hrLabel(h)}</b>`+keys.map(k=>`<br><span class="dot" style="background:var(--${k})"></span>${MODELNAME[k]} ${Math.round(C(k)[h])}%`).join('');
    tip.style.display='block';const left=x(h)*r.width/W;tip.style.left=(left>r.width-130?left-120:left+10)+'px';tip.style.top='10px';};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')return;cross.setAttribute('visibility','hidden');tip.style.display='none';});
  $('ctable').innerHTML=`<thead><tr><th>Hour</th>${keys.map(k=>`<th>${MODELNAME[k]}</th>`).join('')}</tr></thead><tbody>`+
    [...Array(24).keys()].map(h=>`<tr><td>${hrLabel(h)}</td>${keys.map(k=>`<td>${Math.round(C(k)[h])}%</td>`).join('')}</tr>`).join('')+'</tbody>';
}

/* ---- Wind ---- */
function drawWind(D,N){
  const keys=D.keys,two=keys.length>1;
  const G=(loc,k)=>D.surf[k][loc];
  const C=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'],comp=d=>C[Math.round(d/22.5)%16];
  const arrow=d=>`<svg class="arrow" viewBox="0 0 14 14" aria-hidden="true"><g transform="rotate(${d} 7 7)"><path d="M7 1.5v11M3.5 9l3.5 3.5L10.5 9"/></g></svg>`;
  const allG=['base','top'].flatMap(l=>keys.flatMap(k=>G(l,k).wind_gusts_10m));
  const W=390,H=210,m={l:34,r:12,t:10,b:28},MAX=Math.max(15,Math.ceil(Math.max(...allG)/5)*5);
  const x=h=>m.l+(W-m.l-m.r)*h/23,y=v=>m.t+(H-m.t-m.b)*(1-v/MAX);
  const panels={};let hour=10,timer=null;
  const slider=$('wh'),play=$('wp');
  function set(h){hour=h;slider.value=h;draw();}
  [['base','wbase'],['top','wtop']].forEach(([loc,id])=>{
    const svg=$(id);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    for(let v=0;v<=MAX;v+=5){el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v?'var(--grid)':'var(--axis)'},svg);el('text',{x:m.l-6,y:y(v)+4,'text-anchor':'end'},svg).textContent=v;}
    el('text',{x:m.l+4,y:m.t+10},svg).textContent='mph';
    [0,6,12,18].forEach(h=>{el('text',{x:x(h),y:H-9,'text-anchor':h?'middle':'start'},svg).textContent=hrLabel(h);});
    const cur=el('line',{y1:m.t,y2:H-m.b,stroke:'var(--ink2)'},svg),dots={};
    keys.forEach(k=>{el('path',{d:G(loc,k).wind_gusts_10m.map((v,h)=>(h?'L':'M')+x(h).toFixed(1)+' '+y(v).toFixed(1)).join(''),fill:'none',stroke:`var(--${k})`,'stroke-width':2,'stroke-linejoin':'round'},svg);
      dots[k]=el('circle',{r:4.5,fill:`var(--${k})`,stroke:'var(--surface)','stroke-width':2},svg);});
    panels[loc]={cur,dots};
    svg.style.cursor='pointer';
    const pick=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width;set(Math.max(0,Math.min(23,Math.round((px-m.l)/(W-m.l-m.r)*23))));};
    svg.addEventListener('pointerdown',pick);svg.addEventListener('pointermove',e=>{if(e.buttons)pick(e);});
  });
  function draw(){
    $('wl').textContent=hrLabel(hour);
    for(const loc in panels){const p=panels[loc];p.cur.setAttribute('x1',x(hour));p.cur.setAttribute('x2',x(hour));
      for(const k in p.dots){p.dots[k].setAttribute('cx',x(hour));p.dots[k].setAttribute('cy',y(G(loc,k).wind_gusts_10m[hour]));}}
    const cell=(loc,k)=>{const o=G(loc,k),d=o.wind_direction_10m[hour];return `<td class="big">${f1(o.wind_gusts_10m[hour])} mph<small>${arrow(d)}${comp(d)} wind, ${f1(o.wind_speed_10m[hour])} mph sustained</small></td>`;};
    const row=(n,loc)=>{let r=`<tr><td>${n}</td>${keys.map(k=>cell(loc,k)).join('')}`;
      if(two){const d=G(loc,'rr').wind_gusts_10m[hour]-G(loc,'ec').wind_gusts_10m[hour];r+=`<td>${sgn(d)}${f1(Math.abs(d))} mph</td>`;}return r+'</tr>';};
    $('wtable').innerHTML=`<thead><tr><th>Gust</th>${keys.map(k=>`<th><span class="dot" style="background:var(--${k})"></span>${MODELNAME[k]}</th>`).join('')}${two?'<th>RRFS minus ECMWF</th>':''}</tr></thead><tbody>${row('Base','base')}${row('Summit','top')}</tbody>`;
  }
  slider.oninput=()=>{hour=+slider.value;draw();};
  play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='Play';return;}play.textContent='Pause';timer=setInterval(()=>set((hour+1)%24),700);timers.push(timer);};
  draw();
}

/* ---- Snowfall ---- */
function drawSnow(D){
  const keys=D.keys,cm=v=>v==null?'n/a':f1(v)+' cm';
  $('snow').innerHTML=`<thead><tr><th>Day</th>${keys.map(k=>`<th>${MODELNAME[k]} base</th><th>${MODELNAME[k]} summit</th>`).join('')}</tr></thead><tbody>`+
    D.days.map((d,i)=>`<tr><td>${fmtDay(d)}${i===3?'<small>forecast day</small>':''}</td>${keys.map(k=>`<td>${cm(D.snow[k].base[i])}</td><td>${cm(D.snow[k].top[i])}</td>`).join('')}</tr>`).join('')+'</tbody>';
}

/* ---- Freezing level ---- */
function drawFz(D,N){
  const keys=D.keys,R=D.R,svg=$('fz'),tip=$('ftip');
  const W=N?400:780,H=N?250:280,m=N?{l:58,r:10,t:14,b:32}:{l:66,r:150,t:14,b:32};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const vals=keys.flatMap(k=>D.fz[k].filter(v=>v&&!v.below).map(v=>v[0]));
  const LO=Math.floor((Math.min(R.base.ft,...vals)-500)/1000)*1000,HI=Math.ceil((Math.max(R.top.ft,...vals)+500)/1000)*1000;
  const x=i=>m.l+(W-m.l-m.r)*(i+.5)/4,y=v=>m.t+(H-m.t-m.b)*(1-(v-LO)/(HI-LO));
  for(let v=LO+(LO%1000?1000-LO%1000:0);v<=HI;v+=1000){el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:'var(--grid)'},svg);el('text',{x:m.l-8,y:y(v)+4,'text-anchor':'end'},svg).textContent=v.toLocaleString()+' ft';}
  [[R.top.ft,`Summit ${R.top.ft.toLocaleString()} ft`],[R.base.ft,`Base ${R.base.ft.toLocaleString()} ft`]].forEach(([v,n])=>{
    el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:'var(--ref)','stroke-dasharray':'6 4'},svg);
    const t=el('text',N?{x:m.l+4,y:y(v)-5}:{x:W-m.r+8,y:y(v)+4},svg);t.textContent=n;t.style.fill='var(--ink2)';});
  D.days.forEach((d,i)=>{el('text',{x:x(i),y:H-10,'text-anchor':'middle'},svg).textContent=N?fmtDay(d,{month:'short',day:'numeric'}):fmtDay(d);});
  keys.forEach((k,ki)=>{const off=keys.length>1?(ki?9:-9):0,F=D.fz[k];
    let d='',pen=false;F.forEach((v,i)=>{if(!v||v.below){pen=false;return;}d+=(pen?'L':'M')+(x(i)+off).toFixed(1)+' '+y(v[0]).toFixed(1);pen=true;});
    el('path',{d,fill:'none',stroke:`var(--${k})`,'stroke-width':2},svg);
    F.forEach((v,i)=>{if(!v||!v.below)return;
      el('circle',{cx:x(i)+off,cy:y(R.base.ft),r:5,fill:'var(--surface)',stroke:`var(--${k})`,'stroke-width':2},svg);
      const hit=el('circle',{cx:x(i)+off,cy:y(R.base.ft),r:14,fill:'transparent'},svg);
      const show=()=>{const r=svg.getBoundingClientRect();tip.innerHTML=`<b>${fmtDay(D.days[i])}</b><br><span class="dot" style="background:var(--${k})"></span>${MODELNAME[k]} below the base all day`;
        tip.style.display='block';const tl=(x(i)+off)*r.width/W;tip.style.left=(tl>r.width-190?Math.max(0,tl-190):tl+12)+'px';tip.style.top=(y(R.base.ft)*r.height/H-40)+'px';};
      hit.addEventListener('pointerenter',show);hit.addEventListener('pointerdown',show);
      hit.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')tip.style.display='none';});});
    F.forEach((v,i)=>{if(!v||v.below)return;el('circle',{cx:x(i)+off,cy:y(v[0]),r:5,fill:`var(--${k})`,stroke:'var(--surface)','stroke-width':2},svg);
      const hit=el('circle',{cx:x(i)+off,cy:y(v[0]),r:14,fill:'transparent'},svg);
      const show=()=>{const r=svg.getBoundingClientRect();tip.innerHTML=`<b>${fmtDay(D.days[i])}</b><br><span class="dot" style="background:var(--${k})"></span>${MODELNAME[k]} ${v[0].toLocaleString()} ft at ${hrLabel(v[1])}`;
        tip.style.display='block';const tl=(x(i)+off)*r.width/W;tip.style.left=(tl>r.width-190?Math.max(0,tl-190):tl+12)+'px';tip.style.top=(y(v[0])*r.height/H-14)+'px';};
      hit.addEventListener('pointerenter',show);hit.addEventListener('pointerdown',show);
      hit.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')tip.style.display='none';});});
  });
}

/* ---- SNOTEL ---- */
function drawSnotel(D,N){
  const box=$('snotelbox'),s=D.snotel;
  if(!s||s.error||!s.cur.length){box.innerHTML=`<p class="stat">SNOTEL data could not be loaded${s&&s.error?': '+s.error:''}.</p>`;return;}
  const n=s.cur.length-1,now=s.cur[n],medNow=s.med[n],pct=medNow?Math.round(100*now/medNow):null;
  const dstr=i=>fmtDay(addDays(s.seasonStart,i),{month:'short',day:'numeric'});
  box.innerHTML=`<div class="legend"><span><i class="sw n"></i>This season</span><span><i class="sw md"></i>Median 1991 to 2020</span><span><i class="sw l"></i>Last season</span></div>
  <div class="narrowbox"><h3>${s.name}, ${s.elev?s.elev.toLocaleString()+' ft':''}</h3>
  <p class="stat">${dstr(n)}: <b>${f1(now)} in</b> water${pct!=null?`, ${pct}% of median (${f1(medNow)} in)`:''}. Snow depth ${s.depth[n]??'n/a'} in.</p>
  <div class="rel"><svg id="season" role="img" aria-label="Snow water equivalent this season, median and last season"></svg><div class="tip" id="stip"></div></div>
  <h3 style="margin-top:16px">Change in the last week</h3><p class="stat" id="wkstat"></p>
  <div class="rel"><svg id="wkchart" role="img" aria-label="Snow water equivalent over the last week against the median"></svg><div class="tip" id="wktip"></div></div></div>`;
  // season chart
  const svg=$('season'),tip=$('stip'),W=N?390:600,H=N?230:280,m={l:32,r:12,t:10,b:26},DAYS=273;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const top=Math.max(6,...s.cur.filter(v=>v!=null),...s.medWk.filter(v=>v!=null),...s.prevWk.filter(v=>v!=null)),MAX=Math.ceil(top/4)*4;
  const x=d=>m.l+(W-m.l-m.r)*d/DAYS,y=v=>m.t+(H-m.t-m.b)*(1-v/MAX);
  for(let v=0;v<=MAX;v+=MAX/4){el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v?'var(--grid)':'var(--axis)'},svg);el('text',{x:m.l-6,y:y(v)+4,'text-anchor':'end'},svg).textContent=Math.round(v);}
  el('text',{x:m.l+4,y:m.t+10},svg).textContent='in';
  (N?[['Oct',0],['Dec',61],['Feb',123],['Apr',182],['Jun',243]]:[['Oct',0],['Nov',31],['Dec',61],['Jan',92],['Feb',123],['Mar',151],['Apr',182],['May',212],['Jun',243]]).forEach(([t,d])=>{el('text',{x:x(d),y:H-8,'text-anchor':d?'middle':'start'},svg).textContent=t;});
  const line=(arr,step)=>{let d='',pen=false;arr.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+x(i*step).toFixed(1)+' '+y(v).toFixed(1);pen=true;});return d;};
  el('path',{d:line(s.medWk,7),fill:'none',stroke:'var(--muted)','stroke-width':2,'stroke-dasharray':'5 4'},svg);
  el('path',{d:line(s.prevWk,7),fill:'none',stroke:'var(--last)','stroke-width':2,'stroke-linejoin':'round'},svg);
  el('path',{d:line(s.cur,1),fill:'none',stroke:'var(--now)','stroke-width':3,'stroke-linejoin':'round'},svg);
  if(now!=null)el('circle',{cx:x(n),cy:y(now),r:4.5,fill:'var(--now)',stroke:'var(--surface)','stroke-width':2},svg);
  const cross=el('line',{y1:m.t,y2:H-m.b,stroke:'var(--axis)',visibility:'hidden'},svg);
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,w=Math.max(0,Math.min(39,Math.round((px-m.l)/(W-m.l-m.r)*DAYS/7))),d=w*7;
    cross.setAttribute('x1',x(d));cross.setAttribute('x2',x(d));cross.setAttribute('visibility','visible');
    tip.innerHTML=`<b>${dstr(d)}</b>`+(d<=n&&s.cur[d]!=null?`<br><span class="dot" style="background:var(--now)"></span>This season ${f1(s.cur[d])} in`:'')+`<br><span class="dot" style="background:var(--muted)"></span>Median ${f1(s.medWk[w])} in<br><span class="dot" style="background:var(--last)"></span>Last season ${f1(s.prevWk[w])} in`;
    tip.style.display='block';const left=x(d)*r.width/W;tip.style.left=(left>r.width-170?left-165:left+10)+'px';tip.style.top='8px';};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')return;cross.setAttribute('visibility','hidden');tip.style.display='none';});
  // last week
  const a=Math.max(0,n-7),span=n-a;
  const dS=(s.cur[n]??0)-(s.cur[a]??0),dM=(s.med[n]??0)-(s.med[a]??0),dD=(s.depth[n]!=null&&s.depth[a]!=null)?s.depth[n]-s.depth[a]:null;
  $('wkstat').innerHTML=`${dstr(a)} to ${dstr(n)}: snow water <b>${sgn(dS)}${f1(Math.abs(dS))} in</b> (${f1(s.cur[a])} to ${f1(s.cur[n])} in), while the median for these dates ${dM>=0?'rose':'fell'} ${f1(Math.abs(dM))} in.`+(dD!=null?` Snow depth <b>${sgn(dD)}${Math.abs(dD)} in</b> (${s.depth[a]} to ${s.depth[n]} in).`:'');
  const w2=$('wkchart'),t2=$('wktip'),W2=390,H2=200,m2={l:34,r:78,t:12,b:26};
  w2.setAttribute('viewBox',`0 0 ${W2} ${H2}`);
  const wv=[...s.cur.slice(a),...s.med.slice(a)].filter(v=>v!=null),MX=Math.max(1,Math.ceil(Math.max(...wv,0)*2)/2+0.5);
  const x2=i=>m2.l+(W2-m2.l-m2.r)*(span?(i-a)/span:0.5),y2=v=>m2.t+(H2-m2.t-m2.b)*(1-v/MX);
  const stepv=MX>4?1:0.5;for(let v=0;v<=MX+1e-9;v+=stepv){el('line',{x1:m2.l,x2:W2-m2.r,y1:y2(v),y2:y2(v),stroke:v?'var(--grid)':'var(--axis)'},w2);el('text',{x:m2.l-6,y:y2(v)+4,'text-anchor':'end'},w2).textContent=v.toFixed(1);}
  el('text',{x:m2.l+4,y:m2.t+10},w2).textContent='in';
  for(let i=a;i<=n;i++)if([0,2,4,span].includes(i-a))el('text',{x:x2(i),y:H2-8,'text-anchor':'middle'},w2).textContent=dstr(i);
  const ln=arr=>{let d='',pen=false;for(let i=a;i<=n;i++){const v=arr[i];if(v==null){pen=false;continue;}d+=(pen?'L':'M')+x2(i).toFixed(1)+' '+y2(v).toFixed(1);pen=true;}return d;};
  el('path',{d:ln(s.med),fill:'none',stroke:'var(--muted)','stroke-width':2,'stroke-dasharray':'5 4'},w2);
  el('path',{d:ln(s.cur),fill:'none',stroke:'var(--now)','stroke-width':3,'stroke-linejoin':'round'},w2);
  for(let i=a;i<=n;i++)if(s.cur[i]!=null)el('circle',{cx:x2(i),cy:y2(s.cur[i]),r:4,fill:'var(--now)',stroke:'var(--surface)','stroke-width':2},w2);
  const lab=(v,t)=>{if(v==null)return;const e=el('text',{x:x2(n)+8,y:y2(v)+4},w2);e.textContent=t;e.style.fill='var(--ink2)';};
  const mn=s.med[n],cn=s.cur[n];lab(mn,'Median '+f1(mn));if(cn!=null){let yy=cn;if(mn!=null&&Math.abs(y2(cn)-y2(mn))<14)yy=cn+(cn<mn?-1:1)*(14*MX/(H2-m2.t-m2.b));lab(yy,'Now '+f1(cn));}
  const c2=el('line',{y1:m2.t,y2:H2-m2.b,stroke:'var(--axis)',visibility:'hidden'},w2);
  const mv=e=>{const r=w2.getBoundingClientRect(),px=(e.clientX-r.left)*W2/r.width,i=a+Math.max(0,Math.min(span,Math.round((px-m2.l)/(W2-m2.l-m2.r)*span)));
    c2.setAttribute('x1',x2(i));c2.setAttribute('x2',x2(i));c2.setAttribute('visibility','visible');
    t2.innerHTML=`<b>${dstr(i)}</b><br><span class="dot" style="background:var(--now)"></span>Snow water ${f1(s.cur[i])} in<br><span class="dot" style="background:var(--muted)"></span>Median ${f1(s.med[i])} in<br>Snow depth ${s.depth[i]??'n/a'} in`;
    t2.style.display='block';const left=x2(i)*r.width/W2;t2.style.left=(left>r.width-160?left-150:left+10)+'px';t2.style.top='4px';};
  w2.addEventListener('pointermove',mv);w2.addEventListener('pointerdown',mv);
  w2.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')return;c2.setAttribute('visibility','hidden');t2.style.display='none';});
}

/* ===================== App ===================== */
let lastData=null,busy=false;
function setStatus(t,err){const s=$('status');s.textContent=t;s.className='status'+(err?' err':'');}
async function go(){
  if(busy)return;
  const R=RESORTS.find(r=>r.id===$('resort').value),date=$('date').value,today=todayStr();
  if(!date){setStatus('Pick a date.',true);return;}
  if(date<today){setStatus('That date is in the past. Pick today or later.',true);return;}
  store.set({resort:R.id,date});
  busy=true;$('go').disabled=true;setStatus(`Loading ${R.name} for ${fmtDay(date)}…`);
  try{
    const D=await load(R,date);lastData=D;render(D);
    setStatus(D.mode==='compare'?'ECMWF vs RRFS.':'ECMWF only: RRFS does not reach this date.');
  }catch(e){setStatus(e.message||String(e),true);}
  finally{busy=false;$('go').disabled=false;}
}
(function init(){
  const sel=$('resort');sel.innerHTML=RESORTS.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
  const today=todayStr(),saved=store.get();
  const dt=$('date');dt.min=today;dt.max=addDays(today,15);
  sel.value=RESORTS.some(r=>r.id===saved.resort)?saved.resort:'copper';
  dt.value=saved.date&&saved.date>=today&&saved.date<=dt.max?saved.date:addDays(today,1);
  $('go').onclick=go;
  sel.onchange=go;dt.onchange=()=>{if(dt.value)go();};
  window.matchMedia('(max-width:560px)').addEventListener?.('change',()=>{if(lastData)render(lastData);});
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  go();
})();
</script>
